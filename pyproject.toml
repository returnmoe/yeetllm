[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "yeetllm"
version = "0.1.0.dev0"
description = "RunPod-ready multi-model vLLM appliance with one OpenAI-compatible endpoint"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "return moe" }]
dependencies = [
  # Match the packages already present in the pinned official vLLM image.
  "httpx==0.28.1",
  "huggingface-hub==1.27.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "starlette==1.6.0",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "ruff==0.15.5",
]

[project.scripts]
yeetllm = "yeetllm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yeetllm"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["yeetllm"]
