# Reference configuration for two 96 GB RTX Pro 6000 Blackwell GPUs. The model
# repository reports roughly 170 GB total VRAM use at this context length.
server:
  host: 127.0.0.1
  port: 8000

startup:
  policy: all
  parallelism: 1

models:
  - id: deepseek-v4-flash-abliterated
    model: fraserprice/DeepSeek-V4-Flash-Abliterated
    trust_remote_code: false

    gpus: [0, 1]
    tensor_parallel_size: 2
    pipeline_parallel_size: 1
    distributed_executor_backend: auto

    dtype: auto
    # Let vLLM read the checkpoint's DeepSeek-V4 FP4/FP8 metadata.
    quantization: auto
    max_model_len: 262144
    gpu_memory_utilization: 0.92
    kv_cache_dtype: fp8

    extra_args:
      - --max-num-seqs
      - "128"
      - --max-num-batched-tokens
      - "4096"
      - --tokenizer-mode
      - deepseek_v4
      - --block-size
      - "256"
      - --async-scheduling
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --reasoning-parser
      - deepseek_v4
      - --enable-auto-tool-choice
      - --tool-call-parser
      - deepseek_v4
      - --default-chat-template-kwargs.thinking=true
      - --default-chat-template-kwargs.reasoning_effort=high

      # Optional MTP speculative decoding. Enable only after the base setup is
      # proven on your selected GPU type.
      # - --speculative-config
      # - '{"method":"mtp","num_speculative_tokens":2,"draft_sample_method":"probabilistic"}'

ssh:
  # sshd starts only when one of YeetLLM's supported public-key sources exists.
  enable: auto
  port: 22
