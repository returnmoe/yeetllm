# Conservative smoke-test configuration for one 288 GB B300 GPU. The
# checkpoint is 163.49 GiB on disk; use at least a 250 GB persistent volume.
# Raise max_model_len only after this configuration is ready.
server:
  host: 127.0.0.1
  port: 8000

startup:
  policy: all
  parallelism: 1

models:
  - id: deepseek-v4-flash-0731-abliterated
    model: sakamakismile/DeepSeek-V4-Flash-0731-Abliterated-NVFP4
    trust_remote_code: true

    gpus: [0]
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    distributed_executor_backend: auto

    dtype: auto
    # Let vLLM read the checkpoint's mixed NVFP4/FP8 metadata.
    quantization: auto
    max_model_len: 4096
    gpu_memory_utilization: 0.90
    kv_cache_dtype: fp8

    extra_args:
      # Keep the first launch conservative and debuggable. Remove this only
      # after generation succeeds on the selected GPU topology.
      - --enforce-eager
      - --max-num-seqs
      - "1"
      - --max-num-batched-tokens
      - "4096"
      - --tokenizer-mode
      - deepseek_v4
      - --block-size
      - "256"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --reasoning-parser
      - deepseek_v4
      - --enable-auto-tool-choice
      - --tool-call-parser
      - deepseek_v4
      - --default-chat-template-kwargs.thinking=true
      - --default-chat-template-kwargs.reasoning_effort=high

      # Optional three-stage DSpark speculative decoding. The drafter is
      # already included and abliterated in this checkpoint. Enable only after
      # target-only serving works and confirm that it still fits in VRAM.
      # - --speculative-config
      # - '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"greedy"}'

ssh:
  # sshd starts only when one of YeetLLM's supported public-key sources exists.
  enable: auto
  port: 22
