name: Development image

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: development-image
  cancel-in-progress: true

jobs:
  publish:
    name: Publish development image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Reclaim space from unused hosted-runner toolchains
        run: .github/scripts/free-build-disk.sh 30
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute immutable development tag
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          repository="ghcr.io/${REPOSITORY,,}"
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "tag=${repository}:dev-${REVISION}" >> "${GITHUB_OUTPUT}"
      - name: Build and publish the thin official-image derivative
        env:
          SOURCE_REVISION: ${{ github.sha }}
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          docker buildx bake -f docker-bake.hcl image \
            --set "image.tags=${TAG}" \
            --push
      - name: Verify published image configuration without pulling CUDA layers
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:dev-${REVISION}"
          tests/docker/remote-smoke.sh "${image}"
      - name: Advance the tested development tag
        env:
          IMMUTABLE_TAG: ${{ steps.tags.outputs.tag }}
          REPOSITORY: ${{ steps.tags.outputs.repository }}
        run: |
          docker buildx imagetools create \
            --tag "${REPOSITORY}:development" \
            "${IMMUTABLE_TAG}"
      - name: Report final disk usage
        if: always()
        run: |
          df -h /
          docker system df || true
